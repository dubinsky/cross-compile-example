pluginManagement {
  repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id 'org.podval.tools.scalajs' version '1.0.5'
  }
  // String path: a File would call Settings.includeBuild (not a plugin build).
  final String conventionsDir =
    providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
}

plugins {
  id 'org.podval.conventions.settings'
}

dependencyResolutionManagement {
  repositories {
    mavenLocal()
    mavenCentral()
  }
}

rootProject.name = 'crosscompile'

include 'core'
include ':core:shared'
include ':core:js-native'
include ':core:jvm'
project(':core:jvm').name = 'example-core-jvm'
include ':core:js'
project(':core:js').name = 'example-core-js'
include ':core:native'
project(':core:native').name = 'example-core-native'

include 'more'
project(':more').name = 'example-more'

include 'aggregate'

includeBuild '/home/dub/Podval/scalajs-gradle'
