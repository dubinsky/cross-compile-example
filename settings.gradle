pluginManagement {
  repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id 'org.podval.tools.scala' version '2.1.0'
    id 'org.podval.tools.scala.settings' version '2.1.0'
  }
  // String path: a File would call Settings.includeBuild (not a plugin build).
  final String conventionsDir = providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
}

plugins {
  id 'org.podval.tools.scala.settings'
  id 'org.podval.conventions.settings' version '0.1.0'
}

dependencyResolutionManagement {
  repositories {
    mavenLocal()
    mavenCentral()
  }
}

rootProject.name = 'crosscompile'

include 'core'
include 'more'
include 'aggregate'

// Directory names select the backend. Project names can still be changed afterwards.
scalaBackend.includeBackendProjects()

project(':core:jvm').name = 'example-core-jvm'
project(':core:js').name = 'example-core-js'
project(':core:native').name = 'example-core-native'
project(':more').name = 'example-more'

//includeBuild '/home/dub/Podval/scalajs-gradle'
