plugins {
  id 'org.podval.tools.scala'
}

scala.scalaVersion = scalaVersion
// Gradle 9.8.1 still defaults Zinc to 1.12.0.
scala.zincVersion = '1.12.1'

dependencies {
  implementation project(':core:example-core-js')
//  scalajs 'io.github.gmkumar2005:scala-js-env-playwright_2.13:0.1.19'
}

tasks.register('sourcesJar', Jar) {
  from sourceSets.main.allSource
  archiveClassifier.set('sources')
}

link {
  moduleKind = 'ESModule'
  moduleInitializers {
    main {
      className = 'example.MoreMain'
      mainMethodHasArgs = true
    }
  }
}

run {
//  jsEnv = "Playwright"
//  browserName = "chrome"
}

tasks.withType(ScalaCompile).configureEach { scalaCompileOptions.additionalParameters = ['-release:17'] }
